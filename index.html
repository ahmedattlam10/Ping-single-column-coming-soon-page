<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;600;700&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/6002a7363b.js"
      crossorigin="anonymous"
    ></script>

    <title>Frontend Mentor | Ping coming soon page</title>
  </head>
  <body>
    <div class="container">
      <main class="content">
        <img class="logo" src="./images/logo.svg" alt="Ping" />
        <h1 class="title">
          We are launching <span class="highlight">soon!</span>
        </h1>
        <p class="desc">Subscribe and get notified</p>
        <form class="subscribe-form">
          <div class="input-wrapper">
            <label class="visually-hidden" for="email-address"
              >Your email address</label
            >
            <input
              class="form-input"
              name="emailAddress"
              id="email-address"
              type="email"
              placeholder="Your email address..."
              aria-describedby="email-error"
              required
            />
            <p id="email-error" class="error-msg" hidden>
              Please provide a valid email address
            </p>
          </div>
          <button class="submit-btn" type="submit">Notify Me</button>
        </form>
        <img
          class="dashboard"
          src="./images/illustration-dashboard.png"
          alt="Illustration Dashboard"
        />
      </main>
      <footer class="footer">
        <div class="social-links">
          <a href="#" aria-label="Facebook"
            ><i class="fa-brands fa-facebook-f" aria-hidden="true"></i
          ></a>
          <a href="#" aria-label="Twitter">
            <i class="fa-brands fa-twitter" aria-hidden="true"></i
          ></a>
          <a href="#" aria-label="Instagram"
            ><i class="fa-brands fa-instagram" aria-hidden="true"></i
          ></a>
        </div>
        <p class="copyright">&copy; Copyright Ping. All rights reserved.</p>
      </footer>
    </div>

    <script src="main.js"></script>
  </body>
</html>
